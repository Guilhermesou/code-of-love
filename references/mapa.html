<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nossos lugares</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#0B0A0C}
  #map{position:absolute;inset:0;background:#0B0A0C}
  .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.82) contrast(1.05) sepia(.18)}
  .leaflet-container{background:#0B0A0C;font-family:'Jost',system-ui,sans-serif}
  .leaflet-control-attribution{background:rgba(8,7,10,.7);color:rgba(243,236,230,.6);font-size:10px}
  .leaflet-control-attribution a{color:rgba(243,236,230,.8)}
  .pin{width:14px;height:14px;border-radius:50%;background:#C25A69;box-shadow:0 0 0 4px rgba(194,90,105,.25),0 0 18px rgba(194,90,105,.9)}
  .leaflet-popup-content-wrapper{background:#15121a;color:#F3ECE6;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  .leaflet-popup-tip{background:#15121a}
  .leaflet-popup-content{margin:12px 16px;font-size:13px;line-height:1.5}
  .leaflet-popup-content b{font-weight:500;letter-spacing:.02em}
  .leaflet-popup-content span{display:block;color:rgba(243,236,230,.55);font-size:11px;margin-top:2px}
</style>
</head>
<body>
<div id="map"></div>
<script>
  // Troque por lugares reais de vocês: coordenadas, nome e a lembrança.
  var lugares = [
    { ll:[-23.5505,-46.6333], nome:'[o lugar do primeiro encontro]', quando:'[data]' },
    { ll:[-22.9068,-43.1729], nome:'[o lugar do pedido de namoro]', quando:'[data]' },
    { ll:[-19.9167,-43.9345], nome:'[o lugar do casamento]', quando:'[data]' }
  ];
  var map = L.map('map', { scrollWheelZoom:false, zoomControl:true, attributionControl:true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:18
  }).addTo(map);
  var icon = L.divIcon({ className:'', html:'<div class="pin"></div>', iconSize:[14,14], iconAnchor:[7,7] });
  var pts = [];
  lugares.forEach(function(l){
    L.marker(l.ll, { icon:icon }).addTo(map).bindPopup('<b>'+l.nome+'</b><span>'+l.quando+'</span>');
    pts.push(l.ll);
  });
  L.polyline(pts, { color:'#C25A69', weight:1.2, opacity:.5, dashArray:'4 6' }).addTo(map);
  map.fitBounds(L.latLngBounds(pts).pad(0.35));
</script>
</body>
</html>
